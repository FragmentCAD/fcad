[package]
name = "fcad-studio"
version = "0.1.0"
description = "FragmentCAD Studio IDE"
authors = ["FragmentCAD Team"]
edition = "2021"

[lib]
name = "fcad_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fcad-core = { path = "../../fcad-core" }
fcad-renderer = { path = "../../fcad-renderer" }
# Para obtener el handle de ventana nativo
raw-window-handle = "0.6"



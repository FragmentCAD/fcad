[package]
name = "fcad-studio"
version = "0.1.0"
description = "FragmentCAD Studio IDE"
authors = ["FragmentCAD Team"]
edition = "2021"

[lib]
name = "fcad_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
fcad-core = { workspace = true }
fcad-renderer = { workspace = true }
# Para obtener el handle de ventana nativo
bevy_ecs = { workspace = true }
raw-window-handle = { workspace = true }



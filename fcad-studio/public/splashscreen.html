<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FragmentCAD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .splash {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 14, 0.95);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      gap: 28px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #f0f0f0;
      text-transform: uppercase;
    }

    .logo span {
      color: #3B82F6;
    }

    .subtitle {
      font-size: 11px;
      color: rgba(240, 240, 240, 0.35);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: -16px;
    }

    .loader {
      width: 120px;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }

    .loader::after {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #3B82F6, transparent);
      border-radius: 1px;
      animation: loading 1.2s ease-in-out infinite;
    }

    @keyframes loading {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .status {
      font-size: 10px;
      color: rgba(240, 240, 240, 0.25);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="splash" data-tauri-drag-region>
    <div class="logo"><span>Fragment</span>CAD</div>
    <div class="subtitle">Studio</div>
    <div class="loader"></div>
    <div class="status">Initializing...</div>
  </div>
</body>
</html>

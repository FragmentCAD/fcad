[workspace]
package.version = "0.1.0"
package.authors = ["FragmentCAD Team"]
package.edition = "2021"
package.license = "MIT"
package.description = "FragmentCAD Monorepo Workspace"

members = [
    "fcad-core",
    "fcad-renderer",
    "fcad-studio/src-tauri",
]
resolver = "2"

[workspace.dependencies]
# ECS & Scheduling
bevy_ecs = "0.13"

# Rendering
wgpu = "28.0.0"
glam = "0.32.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
lyon = "1.0.16"
raw-window-handle = "0.6"
pollster = "0.4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Common
fcad-core = { path = "fcad-core" }
fcad-renderer = { path = "fcad-renderer" }

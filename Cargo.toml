[package]
name = "fcad-core"
version = "0.1.0"
edition = "2021"
description = "FragmentCAD Core Engine (Math, ECS, RAG, MCP)"

[dependencies]
# ECS & Memory
bevy_ecs = "0.13"

# Spatial Index
rstar = "0.12"

# Math & Geometry
geo = "0.27"
geo-booleanop = "0.3"
robust = "1.1"

# Serialization & Persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
serde_yaml = "0.9"

# Async & Networking (MCP)
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Semantic RAG Engine
rusqlite = { version = "0.31", features = ["bundled"] }
# sqlite-vec extension configuration goes here (often built dynamically or bundled)
ort = { version = "2.0.0-rc.11", default-features = false } # Embedded ML

# CAD Formats
dxf = "0.5"

[dev-dependencies]
# Dependencies only for tests
